data:
  train_files: hiyouga/math12k@train # Hugging Face dataset
  val_files: hiyouga/math12k@test # Hugging Face dataset
  prompt_key: problem
  answer_key: answer
  image_key: images
  max_prompt_length: 4096
  max_response_length: 4096
  rollout_batch_size: 64 # 256 for 8 GPUs, 64 for 2 GPUs
  val_batch_size: 64 # 256 for 8 GPUs, 32 for 2 GPUs
  format_prompt: ./examples/format_prompt/math_format.jinja
  override_chat_template: null
  shuffle: false  # 打乱data顺序
  seed: 42
  max_pixels: 12845056 # 16384 * 28 * 28 image_tokens = mix_pixels/28/28
  min_pixels: 262144  # 512x512
  filter_overlong_prompts: true
  filter_overlong_num_proc: null  # null = auto/env; v36 overrides to 64

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  adaptive_actor_kl: false
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2

worker:
  actor:
    global_batch_size: 64 # 128 for 8 GPUs, 32 for 2 GPUs, actor global batch size = global_batch_size x worker.rollout.n
    micro_batch_size_per_device_for_update: 8 #  8，Actor 训练阶段，每个 GPU 每次前向/反向传播处理多少个 responses
    micro_batch_size_per_device_for_experience: 16 # 16. Rollout 阶段，每个 GPU 一次性处理多少个 prompts
    max_grad_norm: 1.0
    padding_free: true
    ulysses_sequence_parallel_size: 1
    # worker.actor.clip_ratio_low: 0.2  # DAPO 
    # worker.actor.clip_ratio_high: 0.28  # DAPO 
    model:
      model_path: Qwen/Qwen2.5-7B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw  # {adamw, adamw_bf16}
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: false  # H20 97GB has enough GPU memory without offload
      offload_optimizer: false  # Avoid CPU OOM from offload init with 8 workers

  rollout:
    n: 16 # grpo experience 5
    temperature: 1.0
    top_p: 1.0
    gpu_memory_utilization: 0.48  # 0.48
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    limit_images: 0
    val_override_config:
      temperature: 0.01
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true  # true: more CPU memory; false: more GPU memory
      enable_rank0_init: true
    offload:
      offload_params: false

  reward:
    reward_type: batch
    reward_function: ./examples/reward_function/math.py:compute_score

trainer:
  total_epochs: 1
  max_steps: null
  project_name: easy_r1
  experiment_name: qwen2_5_7b_StepCount_grpo
  logger: ["console", "wandb"]
  nnodes: 1
  n_gpus_per_node: 8
  val_freq: 10  # -1 to disable 33
  val_before_train: true
  val_only: false
  val_generations_to_log: 3
  save_freq: 1500  # -1 to disable
  save_limit: 5  # -1 to disable
  save_checkpoint_path: ./save/easy_r1_default
  load_checkpoint_path: null
  v37_run_class: null
  v37_resume_mode: null
  v37_expected_resume_checkpoint_path: null
  v37_expected_resume_checkpoint_sha256: null
